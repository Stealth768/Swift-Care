<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Care | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00d4ff 0%, #0099cc 25%, #1e9f8f 50%, #2bb88a 75%, #00d4ff 100%);
            --primary-light: #59fff9;
            --primary-dark: #0bece0;
            --accent-green: #1e9f8f;
            --sos-red: #ff4b4b;
            --sos-glow: #ff0000;
            --text-main: #e6edf3;
            --text-secondary: #1A1A1A;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-bg-hover: rgba(255, 255, 255, 0.12);
            --border-color: rgba(255, 255, 255, 0.15);
            --border-text:rgb(0, 0, 0);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body { 
            height: 100%; 
            width: 100%;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: url(/static/images/procedures/default.png);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text-main); 
            display: flex; 
            overflow: hidden; 
            transition: all 0.3s ease;
        }

        
        .sos-island {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--sos-red) 0%, #ff2e2e 100%);
            padding: 14px 24px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            box-shadow: 0 8px 24px rgba(255, 75, 75, 0.4);
            animation: slideDown 60s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1 !important;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            pointer-events: none;
        }

        .sos-island.active {
            display: flex;
        }

        .sos-countdown {
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            min-width: 40px;
            text-align: center;
        }

        .sos-island i {
            font-size: 1.3rem;
            animation: pulse-sos 60s infinite;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes pulse-sos {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        nav { 
            width: 280px; 
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color); 
            padding: 35px 25px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            overflow-y: auto;
            transition: all 0.4s ease;
            position: relative;
            z-index: 100;
        }

        nav:not(:hover) {
            width: 90px;
            align-items: center;
            padding: 35px 10px;
        }

        nav:not(:hover) .logo i {
            margin-right: 0;
        }

        nav:not(:hover) .logo span {
            display: none;
        }

        nav:not(:hover) .nav-links a {
            justify-content: center;
            padding: 14px 0;
        }

        nav:not(:hover) .nav-links a span {
            display: none;
        }

        nav:not(:hover) .sos-container {
            width: 100%;
        }

        nav:not(:hover) .sos-btn {
            padding: 14px;
        }

        nav:not(:hover) .sos-btn span {
            display: none;
        }

        .nav-toggle {
            display: none;
        }

        nav::-webkit-scrollbar {
            width: 6px;
        }

        nav::-webkit-scrollbar-track {
            background: transparent;
        }

        nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .logo { 
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--text-main); 
            font-size: 1.3rem; 
            margin-bottom: 50px; 
            letter-spacing: 1px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            height: 40px;
        }

        nav:not(:hover) .logo {
            justify-content: center;
        }

        nav:not(:hover) .logo i {
            margin-right: 0;
        }

        nav:not(:hover) .logo span {
            display: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-links { list-style: none; flex-grow: 1; }
        .nav-links li { 
            margin-bottom: 12px; 
        }
        .nav-links a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            font-weight: 500; 
            padding: 14px 18px; 
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 12px; 
            transition: all 0.3s ease; 
            border: 2px solid transparent;
            position: relative;
            white-space: nowrap;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--primary-light);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .nav-links a:hover { 
            background: var(--card-bg-hover);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .nav-links a:hover::before {
            height: 24px;
        }

        .nav-links a.active { 
            background: var(--card-bg-hover);
            color: var(--primary-light);
            border-color: var(--primary-light);
        }

        .nav-links a.active::before {
            height: 24px;
        }

        nav:not(:hover) .nav-links a.active {
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sos-container { 
            padding-top: 25px; 
            border-top: 1px solid var(--border-color); 
        }

        .sos-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff4b4b, #ff2e2e);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 75, 75, 0.35);
            transition: all 0.3s ease;
            animation: pulse-red 2.5s infinite;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .sos-btn:hover {
            background: linear-gradient(135deg, #ff2e2e, #ff0000);
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(255, 0, 0, 0.5);
        }

        .sos-btn:active {
            transform: scale(0.98);
        }

        @keyframes pulse-red {
            0%, 100% { 
                box-shadow: 0 8px 24px rgba(255, 75, 75, 0.35), 0 0 0 0 rgba(255, 75, 75, 0.7); 
            }
            50% { 
                box-shadow: 0 8px 24px rgba(255, 75, 75, 0.35), 0 0 0 12px rgba(255, 75, 75, 0); 
            }
        }

        main { 
            flex-grow: 1; 
            padding: 40px; 
            overflow-y: auto;
            position: relative;
        }

        main::-webkit-scrollbar {
            width: 8px;
        }

        main::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        main::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        main::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5em;
            position: relative;
            z-index: 2;
           

        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-light) 0%, var(--accent-green) 100%);
            border-radius: 2px;
            opacity: 0.5;
        }

        h3 {
            font-size: 1.3rem;
        }

        h4 {
            font-size: 1.1rem;
        }

        .bento-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 24px; 
        }

        .bento-card { 
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 18px; 
            padding: 28px; 
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(30, 159, 143, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .bento-card:hover { 
            transform: translateY(-8px);
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--primary-light);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .bento-card:hover::before {
            opacity: 1;
        }

        .bento-card > * {
            position: relative;
            z-index: 2;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 400;
            position: relative;
            z-index: 2;
            
        }

        a {
            color: var(--primary-light);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        a:hover {
            color: var(--text-main);
        }

        button:not(.sos-btn) {
            font-family: 'Poppins', sans-serif;

        }

        .text-border {
            -webkit-text-stroke: 1.5px var(--primary-light);
            text-stroke: 1.5px var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links a i {
            width: 24px;
         text-align: center;
         display: flex;
         justify-content: center;
         align-items: center;
        }
        nav:not(:hover) .nav-links a {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        h1, .bento-card > * {
            position: relative;
            z-index: 5;
        }

        .bento-card {
            transform: translateZ(0);
        }

    </style>
</head>
<body>
    
    <div class="sos-island" id="sosIsland">
        <i class="fas fa-exclamation-triangle"></i>
        <span>SOS Active:</span>
        <span class="sos-countdown" id="sosCountdown">60</span>
    </div>

    <nav id="navbar">
        <div>
            <div class="logo" onclick="window.location.href='/'" align-items: center; display: flex; gap: 10px;>
                <i class="fas fa-heartbeat"></i>
                <span>SWIFT CARE</span>
            </div>
            <ul class="nav-links">
                <li><a href="/" id="link-home"><i class="fas fa-home"></i> <span>Home</span></a></li>
                <li><a href="/locator/" id="link-map"><i class="fas fa-map-location-dot"></i> <span>Hospital Locator</span></a></li>
                <li><a href="/dashboard/" id="link-dash"><i class="fas fa-user-doctor"></i> <span>Doctor Panel</span></a></li>
                <li><a href="/academy/" id="link-edu"><i class="fas fa-book-medical"></i> <span>Academy</span></a></li>
            </ul>
        </div>

        <div class="sos-container">
            <button class="sos-btn" onclick="triggerSOS()">
                <i class="fas fa-exclamation-triangle"></i>
                <span>SEND SOS</span>
            </button>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script>
        let sosCountdownInterval = null;
        let sosActive = false;

        function triggerSOS() {
            if (sosActive) {
                alert('SOS already active! Signal still being broadcast.');
                return;
            }

            const confirmSOS = confirm("🚨 CRITICAL ALERT: Broadcast medical emergency to nearest hospitals?");
            
            if (confirmSOS) {
                sosActive = true;
                const startTime = Date.now();
                
                
                sessionStorage.setItem('sosActive', 'true');
                sessionStorage.setItem('sosStartTime', startTime);

                
                const sosIsland = document.getElementById('sosIsland');
                sosIsland.classList.add('active');

                
                sosCountdownInterval = setInterval(() => {
                    const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                    const timeLeft = 60 - elapsedTime;
                    
                    document.getElementById('sosCountdown').textContent = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(sosCountdownInterval);
                        sosIsland.classList.remove('active');
                        sosActive = false;
                        sessionStorage.removeItem('sosActive');
                        sessionStorage.removeItem('sosStartTime');
                        alert('✓ SOS timeframe expired. Signal broadcast completed.');
                    }
                }, 100);

                
                gsap.from(sosIsland, {
                    duration: 0.3,
                    opacity: 0,
                    y: -30
                });

                alert('✓ TRIDENT PROTOCOL ACTIVE: Emergency signal sent to nearby hospitals!\nCountdown: 60 seconds');
            }
        }

        
        function restoreSOSState() {
            const sosStartTime = sessionStorage.getItem('sosStartTime');
            if (sosStartTime) {
                const startTime = parseInt(sosStartTime);
                const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                const timeLeft = 60 - elapsedTime;

                if (timeLeft > 0) {
                    sosActive = true;
                    const sosIsland = document.getElementById('sosIsland');
                    sosIsland.classList.add('active');
                    document.getElementById('sosCountdown').textContent = timeLeft;

                    
                    sosCountdownInterval = setInterval(() => {
                        const currentElapsedTime = Math.floor((Date.now() - startTime) / 1000);
                        const currentTimeLeft = 60 - currentElapsedTime;
                        document.getElementById('sosCountdown').textContent = currentTimeLeft;

                        if (currentTimeLeft <= 0) {
                            clearInterval(sosCountdownInterval);
                            sosIsland.classList.remove('active');
                            sosActive = false;
                            sessionStorage.removeItem('sosActive');
                            sessionStorage.removeItem('sosStartTime');
                        }
                    }, 100);
                } else {
                    
                    sessionStorage.removeItem('sosActive');
                    sessionStorage.removeItem('sosStartTime');
                }
            }
        }

        
        document.addEventListener('DOMContentLoaded', restoreSOSState);
        window.addEventListener('load', restoreSOSState);

        
        document.querySelectorAll('.nav-links a').forEach(link => {
            if (window.location.pathname === '/' && link.getAttribute('href') === '/') {
                link.classList.add('active');
            } else if (window.location.pathname.includes(link.getAttribute('href')) && link.getAttribute('href') !== '/') {
                link.classList.add('active');
            }
        });

        
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('main > *', {
                duration: 0.5,
                opacity: 0,
                y: 20,
                stagger: 0.05
            });
        });
    </script>
</body>
</html>
