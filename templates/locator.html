{% extends 'base.html' %}
{% block content %}
<style>
    .locator-container {
        display: flex;
        gap: 24px;
        height: 85vh;
    }

    .sidebar {
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .search-card {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 24px;
    }

    .search-card h3 {
        margin: 0 0 16px 0;
        color: var(--primary-light);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .radius-container {
        margin-bottom: 20px;
    }

    .radius-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-weight: 600;
    }

    .radius-value {
        color: var(--primary-light);
        font-size: 1.2rem;
        font-weight: 700;
    }

    input[type="range"] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: var(--border-color);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        accent-color: var(--primary-light);
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary-light);
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        transition: all 0.3s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        box-shadow: 0 6px 18px rgba(0, 212, 255, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary-light);
        cursor: pointer;
        border: none;
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        transition: all 0.3s ease;
    }

    .update-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-green) 100%);
        color: #000;
        border: none;
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 700;
        font-family: 'Poppins', sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .update-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(0, 212, 255, 0.3);
    }

    .update-btn:active {
        transform: translateY(0);
    }

    .results-card {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 24px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .results-card h3 {
        margin: 0 0 16px 0;
        color: var(--primary-light);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #resultsContent {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 8px;
    }

    #resultsContent::-webkit-scrollbar {
        width: 6px;
    }

    #resultsContent::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 3px;
    }

    #resultsContent::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.927);
        border-radius: 3px;
    }

    #resultsContent::-webkit-scrollbar-thumb:hover {
        background: rgb(0, 0, 0);
    }

    .result-item {
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 12px 0;
        transition: all 0.3s ease;
    }

    .result-item:last-child {
        border-bottom: none;
    }

    .result-item strong {
        color: var(--primary-light);
        display: block;
        margin-bottom: 4px;
    }

    .result-item small {
        color: var(--text-secondary);
        display: block;
        font-size: 0.85rem;
        line-height: 1.4;
    }

    .map-container {
        flex-grow: 1;
        border-radius: 18px;
        border: 1px solid var(--border-color);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        background: var(--card-bg);
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .empty-results {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        color: var(--text-secondary);
    }

    .empty-results i {
        font-size: 2.5rem;
        color: var(--primary-light);
        opacity: 0.4;
        margin-bottom: 16px;
    }

    .leaflet-popup-content-wrapper {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
    }

    .leaflet-popup-content {
        font-family: 'Poppins', sans-serif;
        color: var(--text-main);
    }
</style>

<div class="locator-container">
    <div class="sidebar">
        <div class="search-card">
            <h3>
                <i class="fas fa-sliders"></i>
                Search Radius
            </h3>
            <div class="radius-container">
                <div class="radius-label">
                    <span>Show within:</span>
                    <span class="radius-value"><span id="radiusVal">5</span> km</span>
                </div>
                <input type="range" id="radiusRange" min="1" max="20" value="5">
            </div>
            <button class="update-btn" onclick="findNearby()">
                <i class="fas fa-magnifying-glass"></i>
                Update Search
            </button>
        </div>

        <div class="results-card">
            <h3>
                <i class="fas fa-hospital"></i>
                Nearby Results
            </h3>
            <div id="resultsContent" style="color: var(--text-secondary); text-align: center; display: flex; align-items: center; justify-content: center;">
                <div class="empty-results">
                    <i class="fas fa-map-location-dot"></i>
                    <p style="margin: 0;">Enter location to see hospitals...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([28.6139, 77.2090], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var userMarker, radiusCircle, markers = [];
    
    const hospitals = [
        { name: "AIIMS Delhi", lat: 28.5672, lng: 77.2100, beds: 120, contact: "011-26588500" },
        { name: "Safdarjung Hospital", lat: 28.5675, lng: 77.2050, beds: 45, contact: "011-26165060" },
        { name: "Max Super Specialty", lat: 28.5283, lng: 77.2111, beds: 12, contact: "011-26515050" },
        { name: "Fortis Escorts", lat: 28.5606, lng: 77.2731, beds: 8, contact: "011-47135000" },
        { name: "Apollo Hospital", lat: 28.5421, lng: 77.2850, beds: 60, contact: "011-71791090" }
    ];

    function getDistance(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var dLat = (lat2-lat1) * Math.PI / 180;
        var dLon = (lon2-lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function createCustomIcon(bedCount) {
        return L.divIcon({
            html: `<div style="background: linear-gradient(135deg, #00d4ff, #1e9f8f); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4); font-weight: bold; color: white; font-size: 0.9rem;">
                        <i class="fas fa-hospital-user" style="color: white;"></i>
                   </div>`,
            iconSize: [40, 40],
            className: 'custom-icon'
        });
    }

    function findNearby() {
        const radius = document.getElementById('radiusRange').value;
        document.getElementById('radiusVal').innerText = radius;
        
        const userLat = 28.5672;
        const userLng = 77.2100;

        if(radiusCircle) map.removeLayer(radiusCircle);
        radiusCircle = L.circle([userLat, userLng], { 
            radius: radius * 1000, 
            color: '#00d4ff', 
            fillColor: 'rgba(0, 212, 255, 0.1)',
            fillOpacity: 0.2,
            weight: 2
        }).addTo(map);

        markers.forEach(m => map.removeLayer(m));
        markers = [];

        let resultsHTML = "";
        let foundCount = 0;
        
        hospitals.forEach((h, idx) => {
            const dist = getDistance(userLat, userLng, h.lat, h.lng);
            if (dist <= radius) {
                foundCount++;
                const marker = L.marker([h.lat, h.lng], { 
                    icon: createCustomIcon(h.beds)
                }).bindPopup(`<div style="color: white;"><strong>${h.name}</strong><br>Beds: ${h.beds}<br>📞 ${h.contact}</div>`).addTo(map);
                markers.push(marker);
                
                resultsHTML += `
                    <div class="result-item">
                        <strong>${h.name}</strong>
                        <small>Distance: ${dist.toFixed(1)} km</small>
                        <small>Available Beds: ${h.beds}</small>
                        <small>📞 ${h.contact}</small>
                    </div>`;
            }
        });
        
        if (foundCount === 0) {
            resultsHTML = `
                <div style="text-align: center; padding: 40px 20px; color: var(--text-secondary);">
                    <p><strong>No hospitals found</strong></p>
                    <p style="margin-top: 8px; font-size: 0.9rem;">Try increasing the search radius</p>
                </div>`;
        }
        
        document.getElementById('resultsContent').innerHTML = resultsHTML;
    }

    document.getElementById('radiusRange').addEventListener('input', (e) => {
        document.getElementById('radiusVal').innerText = e.target.value;
    });

    findNearby();
</script>
{% endblock %}
